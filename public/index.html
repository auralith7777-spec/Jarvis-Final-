<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis control room</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-card">
      <h1>Jarvis</h1>
      <p class="muted">Sign in to open the control room.</p>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button id="login-btn" class="primary">Sign in</button>
      <p id="login-err" class="error" role="alert"></p>
    </div>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="rail">
      <div class="brand"><span class="logo">J</span><div><b>JARVIS</b><small>PRIVATE CONTROL ROOM</small></div></div>
      <p class="eyebrow">WORKSPACE</p>
      <nav class="nav">
        <button data-view="room" class="on">Control room</button>
        <button data-view="log">Activity log</button>
        <button data-view="roster">Model roster</button>
      </nav>
      <div class="operator"><div><b>Authorized operator</b><small>SESSION ACTIVE</small></div><button id="logout" class="ghost" title="Sign out">Sign out</button></div>
    </aside>
    <section class="content">
      <div class="statusline"><span id="statusline"></span><span id="stamp" class="muted"></span></div>
      <div id="main" class="main"></div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
